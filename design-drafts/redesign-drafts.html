<style>
/* Layout: slim draft bar, terminal header with ./tabs, then a page: General (2/3 + 1/3)
   or Performance (3-col grid of per-component panels, each with its own neon accent). */
:root {
  color-scheme: dark;
  --brand: #e01e37;
  --brand-hot: #ff3b55;
  --arch: #1793d1;
  --bg: #060507;
  --panel: #0b090c;
  --line: #2b1c26;
  --ink: #e9e3e9;
  --dim: #7f7381;
  --off: #4b4350;
  --danger: #ff5470;
  --acc: var(--brand-hot);      /* per-panel accent; perf sections override */
  /* the existing performance-page palette */
  --c-cpu: #4ac8ff; --c-ram: #ff9e57; --c-ssd: #ff5c72; --c-gpu: #5ef08a;
  --c-psu: #ffe14d; --c-net: #c08cff; --c-os: #ff8ac4;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.draftbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; background: #000; border-bottom: 1px solid #1d1a20; font-size: 11px; color: #6f6672; }
.draftbar b { color: #d8d0da; font-weight: 700; }

.app { position: relative; min-height: 100vh; overflow: hidden; isolation: isolate; }
.fx { position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    radial-gradient(90% 50% at 50% 0%, rgba(224,30,55,.09), transparent 60%); }
.app[data-page="performance"] .fx { background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    radial-gradient(60% 40% at 20% 0%, rgba(74,200,255,.07), transparent 60%),
    radial-gradient(50% 40% at 85% 10%, rgba(224,30,55,.07), transparent 60%); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.prompt { color: var(--dim); white-space: nowrap; }
.prompt b { color: var(--brand-hot); font-weight: 500; }
.prompt em { font-style: normal; color: var(--arch); }
.cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: -2px; background: var(--brand-hot); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.nav { display: flex; gap: 4px; position: relative; flex-wrap: wrap; }
.nav a { position: relative; z-index: 1; padding: 8px 12px; color: var(--dim); text-decoration: none; }
.nav a::before { content: "./"; color: var(--off); }
.nav a.on { color: var(--ink); }
.nav a.on::before { color: var(--brand-hot); }
.nav a:hover { color: var(--ink); }
.nav .ind { position: absolute; z-index: 0; top: 0; left: 0; pointer-events: none; border-bottom: 2px solid var(--brand-hot); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.btn { padding: 8px 14px; font-weight: 700; font-size: 12px; border: 1px solid var(--line); background: transparent; }
.btn:hover { border-color: var(--acc); }
.btn.arm { background: var(--danger); color: #22040b; border-color: var(--danger); }

.main { display: grid; gap: 20px; padding: 20px 24px 40px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .top, .main { padding-left: 16px; padding-right: 16px; } }

.panel { position: relative; padding: 20px; min-width: 0; background: var(--panel); border: 1px solid var(--line); transition: border-color .2s; }
.panel:hover { border-color: color-mix(in srgb, var(--acc) 35%, var(--line)); }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 13px; font-weight: 700; text-transform: lowercase; }
.ph h2::before { content: "## "; color: var(--acc); }
.ph .meta { color: var(--dim); font-size: 12px; }

/* ---------- general page pieces ---------- */
.vitals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.vital { border: 1px dashed var(--line); padding: 10px 12px; min-width: 0; }
.vital .v { font-size: 24px; font-weight: 700; line-height: 1; }
.vital .l { color: var(--dim); font-size: 11px; margin-top: 4px; }
.vital .l::before { content: "$ "; color: var(--off); }
@media (max-width: 520px) { .vitals { grid-template-columns: minmax(0,1fr); } }
.meterrow { margin-bottom: 14px; }
.meterrow .mh { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.meterrow .mh span:first-child { color: var(--dim); }
.seg { height: 12px; position: relative; overflow: hidden; background: repeating-linear-gradient(90deg, #1c1219 0 6px, transparent 6px 8px); }
.seg i { position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 1%); transform-origin: left; background: repeating-linear-gradient(90deg, var(--acc) 0 6px, transparent 6px 8px); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--acc) 60%, transparent)); transition: width .8s ease; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 20px; margin: 0; }
.stats dt { color: var(--dim); font-size: 11px; }
.stats dd { margin: 2px 0 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .stats { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; }
.spec h3 { margin: 0 0 4px; font-size: 11px; color: var(--dim); font-weight: 600; }
.spec h3::before { content: "> "; color: var(--brand-hot); }
.spec .sub { font-size: 12px; color: var(--dim); }
@media (max-width: 640px) { .specs { grid-template-columns: minmax(0,1fr); } }
.filter { width: 100%; padding: 9px 12px; margin-bottom: 12px; background: #070608; border: 1px solid var(--line); }
.filter::placeholder { color: var(--dim); }
.svc-label { font-size: 11px; color: var(--dim); margin: 4px 0; }
.svcs { list-style: none; margin: 0 0 8px; padding: 0; }
.svc { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.svc .name, .svc .desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc .desc { font-size: 12px; color: var(--dim); }
.svc .acts { display: flex; gap: 6px; align-items: center; }
.svc .state { font-size: 11px; color: var(--dim); min-width: 56px; text-align: right; }
.mini { padding: 4px 8px; font-size: 11px; background: transparent; border: 1px solid var(--line); }
.mini:hover { border-color: var(--brand); }
.pin { border: 0; background: none; color: var(--off); padding: 2px 4px; font-size: 14px; }
.pin.on { color: var(--brand-hot); }
@media (max-width: 520px) { .svc .state { display: none; } }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; box-shadow: inset 0 0 0 1.5px var(--off); }
.dot.ok { background: var(--brand-hot); box-shadow: 0 0 10px var(--brand-hot); }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.todo a { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; text-decoration: none; color: var(--ink); border: 1px dashed var(--line); }
.todo a:hover { border-color: var(--brand); }
.badge { font-size: 12px; font-weight: 700; padding: 2px 6px; color: var(--brand-hot); border: 1px solid var(--brand); }
.badge::before { content: "["; } .badge::after { content: "]"; }
.qs > div { padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.qs > div:first-child { padding-top: 0; } .qs > div:last-child { border-bottom: 0; padding-bottom: 0; }
.qh { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; }
.qh .s { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--dim); }
.qs .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
.sites { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sites li { display: flex; align-items: center; gap: 8px; }
.sites li span:last-child { margin-left: auto; color: var(--dim); font-size: 12px; }
.reboot p { color: var(--dim); font-size: 12px; margin: 0 0 14px; }

/* ---------- performance page ---------- */
.perf { display: grid; gap: 20px; padding: 20px 24px 40px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.perf .span2 { grid-column: span 2; } .perf .span3 { grid-column: 1 / -1; }
@media (max-width: 1100px) { .perf { grid-template-columns: repeat(2, minmax(0,1fr)); } .perf .span2, .perf .span3 { grid-column: 1 / -1; } }
@media (max-width: 760px) { .perf { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 520px) { .perf { padding-left: 16px; padding-right: 16px; } }

.sec { --acc-dim: color-mix(in srgb, var(--acc) 40%, transparent);
  border-color: color-mix(in srgb, var(--acc) 22%, #1a1519);
  background: linear-gradient(to bottom, color-mix(in srgb, var(--acc) 5%, transparent), transparent 140px), var(--panel); }
.sec:hover { border-color: color-mix(in srgb, var(--acc) 50%, #1a1519); box-shadow: 0 0 40px -22px var(--acc); }
.sec.cpu { --acc: var(--c-cpu); } .sec.ram { --acc: var(--c-ram); } .sec.ssd { --acc: var(--c-ssd); }
.sec.gpu { --acc: var(--c-gpu); } .sec.psu { --acc: var(--c-psu); } .sec.net { --acc: var(--c-net); } .sec.os { --acc: var(--c-os); }
.sec .ph h2 { font-size: 15px; color: var(--acc); text-shadow: 0 0 14px var(--acc-dim); }
.sec .ph h2::before { color: color-mix(in srgb, var(--acc) 55%, var(--off)); }
.mood { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
.mood .spin { color: var(--acc); font-size: 15px; width: 1ch; text-shadow: 0 0 8px var(--acc); }
.mood .w { color: var(--ink); }

.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
.big { font-size: 40px; font-weight: 800; line-height: .9; letter-spacing: -.02em; }
.big small { font-size: 18px; color: var(--dim); font-weight: 500; }
.big sup { font-size: 14px; font-weight: 700; margin-left: 4px; vertical-align: super; }
.side { text-align: right; }
.side .v { font-size: 18px; font-weight: 700; }
.side .l, .lab { color: var(--dim); font-size: 11px; }
.lab { margin: 16px 0 8px; display: flex; justify-content: space-between; gap: 10px; }
.lab b { color: var(--ink); font-weight: 700; }

.graph { position: relative; }
.graph canvas { display: block; width: 100%; height: 120px; cursor: crosshair; }
.graph.short canvas { height: 92px; }
.graph .read { position: absolute; top: 4px; left: 6px; font-size: 11px; color: var(--ink); background: rgba(6,5,7,.85); padding: 1px 6px; border: 1px solid var(--line); pointer-events: none; white-space: nowrap; }
.graph .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin-top: 6px; }
.graph .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: 0; }

.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 18px; padding-top: 16px; border-top: 1px dashed color-mix(in srgb, var(--acc) 22%, var(--line)); }
@media (max-width: 760px) { .cols, .cols3 { grid-template-columns: minmax(0,1fr); } }
.box { border: 1px dashed color-mix(in srgb, var(--acc) 28%, var(--line)); padding: 12px; }
.box h4 { margin: 0 0 10px; font-size: 11px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; gap: 8px; }
.box h4 span { color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }

.kv { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.kv div { display: flex; gap: 10px; justify-content: space-between; min-width: 0; }
.kv dt { color: var(--dim); white-space: nowrap; }
.kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.kh { font-size: 11px; color: var(--acc); margin-bottom: 8px; }
.kh::before { content: "> "; color: var(--off); }

/* htop-style bracket meter */
.hm { display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
.hm .t { color: var(--dim); }
.hm .b { color: var(--off); overflow: hidden; flex: 1; min-width: 0; }
.hm .b em { font-style: normal; color: var(--acc); text-shadow: 0 0 6px var(--acc-dim); }
.hm .v { font-weight: 700; }

.threads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.th { aspect-ratio: 1.6; display: grid; place-items: center; font-size: 10px; color: var(--ink); border: 1px solid color-mix(in srgb, var(--acc) 25%, transparent);
  background: color-mix(in srgb, var(--acc) calc(var(--l) * 0.7%), #070608); transition: background .6s; }
.cores { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
.core { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.core .bar { width: 100%; background: repeating-linear-gradient(to top, var(--h) 0 3px, transparent 3px 5px); transition: height .6s; box-shadow: 0 0 10px -4px var(--h); }
.core span { font-size: 10px; color: var(--dim); }

.dimms { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.dimm { border: 1px solid color-mix(in srgb, var(--acc) 40%, transparent); padding: 6px 5px 4px; display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 10px; }
.dimm .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; width: 100%; }
.dimm .chips i { height: 10px; background: color-mix(in srgb, var(--acc) 60%, #000); box-shadow: 0 0 6px -2px var(--acc); }
.dimm .pins { width: 100%; height: 4px; background: repeating-linear-gradient(90deg, #c9a14a 0 1px, transparent 1px 3px); opacity: .7; }
.dimm.empty { border-style: dashed; border-color: var(--line); color: var(--off); }
.dimm.empty .chips i { background: #141016; box-shadow: none; }
.dimm b { color: var(--ink); }

.drive { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.drive:last-child { border-bottom: 0; }
.drive .ico { width: 34px; height: 22px; border: 1px solid var(--acc); position: relative; box-shadow: 0 0 10px -4px var(--acc); }
.drive .ico::after { content: ""; position: absolute; right: 3px; top: 50%; width: 4px; height: 4px; margin-top: -2px; background: var(--acc); border-radius: 50%; animation: led 1.2s steps(2) infinite; }
.drive.hdd .ico { border-radius: 3px; }
@keyframes led { 50% { opacity: .2; } }
.drive .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drive .s { font-size: 11px; color: var(--dim); }

.vram { position: relative; height: 34px; border: 1.5px solid var(--acc); background: color-mix(in srgb, var(--acc) 4%, transparent); overflow: hidden; }
.vram .fill { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--acc) 30%, transparent) 0 4px, transparent 4px 6px); transition: width .8s; }
.vram .edge { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--acc); box-shadow: 0 0 8px var(--acc); transition: left .8s; }
.vram span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 12px; }

.tiers { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-top: 14px; }
@media (max-width: 760px) { .tiers { grid-template-columns: minmax(0,1fr); } }
.tier .kv dt { white-space: normal; }
.tier .sub { border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.tier .sub dd { color: var(--acc); font-weight: 700; }

.procs { width: 100%; border-collapse: collapse; font-size: 12px; }
.procs th { text-align: left; font-weight: 700; color: #060507; background: var(--acc); padding: 3px 8px; white-space: nowrap; }
.procs td { padding: 4px 8px; border-bottom: 1px solid #151116; white-space: nowrap; }
.procs td.cmd { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
.procs tr:hover td { background: color-mix(in srgb, var(--acc) 8%, transparent); }
.procs .r { text-align: right; }
.procs .st { font-weight: 700; }
.tablewrap { overflow-x: auto; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; padding: 10px 14px; background: #121015; border: 1px solid #2c2730; color: #ece7ec; font-size: 12px; max-width: calc(100% - 32px); }
.sample { font-size: 11px; color: var(--dim); padding: 0 24px 28px; }
@media (max-width: 520px) { .sample { padding: 0 16px 24px; } }

@media (prefers-reduced-motion: reduce) {
  .cursor, .drive .ico::after { animation: none; }
  .seg i, .th, .core .bar, .vram .fill, .vram .edge { transition: none; }
}
</style>

<script>

  const fmtRate = b => b >= MB ? (b / MB).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";

  // ======================= sample data =======================

  // 2 minutes of 1 s history per series
  const N = 120;
  const series = (base, amp, lo, hi) => { let v = base; return Array.from({ length: N }, () => (v = clamp(v + (Math.random() - .5) * amp, lo, hi))); };
  const H = {
    cpu: series(35, 8, 8, 95), cpuT: series(61, 2, 40, 90),

    gpu: series(12, 6, 0, 80), gpuT: series(48, 1.5, 35, 85),
    psuHi: series(205, 10, 150, 320), psuLo: [],
    netRx: series(2.4, 1.6, 0.1, 20).map(v => v * MB), netTx: series(0.4, 0.4, 0.02, 6).map(v => v * MB),

  H.psuLo = H.psuHi.map(v => v * 0.8);

  // ======================= state =======================
  const state = { page: "general", q: "", pins: new Set(["admin-site.service", "mc-site.service", "wow-site.service"]), armed: false, rebooted: false, msg: "" };

  };
  const kv = rows => `<dl class="kv">${rows.map(([k, v, c]) => `<div><dt>${k}</dt><dd class="num"${c ? ` style="color:${c}"` : ""}>${v}</dd></div>`).join("")}</dl>`;
  const SPIN = "⣾⣽⣻⢿⡿⣟⣯⣷";

  // ======================= general =======================
  const memPct = () => (G.system.mem.total - G.system.mem.avail) / G.system.mem.total * 100;

  const svcRow = ([unit, desc, running]) => `

  const servicesBody = () => {
    const q = state.q.trim().toLowerCase(), match = s => !q || s[0].toLowerCase().includes(q) || s[1].toLowerCase().includes(q);

  };
  const rebootBody = () => state.rebooted ? `<p>Reboot scheduled. This panel will be unreachable shortly. (Draft only: nothing happened.)</p>`

  function generalPage() {

  // ======================= performance =======================

  const psuSum = tier => P.psu.items.filter(i => !tier || i[0] === tier).reduce((a, i) => [a[0] + i[2], a[1] + i[3]], [0, 0]);

      <!-- PSU -->

          <div style="min-width:0">
            <div class="hero"><div class="big num"><span id="netNow">${fmtRate(n.rx + n.tx)}</span></div><div class="side"><div class="v">${n.kind}</div><div class="l">${n.iface} · connected</div></div></div>
            <div class="graph" data-graph="net"><canvas></canvas><div class="legend"><span><i style="background:var(--c-net)"></i>download ↑</span><span><i style="background:#e0c6ff"></i>upload ↓</span></div></div>
          </div>
          <div style="min-width:0;margin-top:16px;padding-top:14px;border-top:1px dashed color-mix(in srgb, var(--acc) 22%, var(--line))">
            <div class="kh">live</div><div id="netKv">${netKv()}</div>
            <div class="kh" style="margin-top:14px">totals</div>${kv([["received", n.rxTot], ["sent", n.txTot], ["interface", n.iface]])}
          </div>
        </div>
      </section>

      <!-- OS -->
      <section class="panel sec os span3" data-anim>
        <div class="ph"><h2>os</h2>${mood("os", "healthy")}</div>
        <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,3fr)">
          <div>${kv([["distro", o.distro], ["kernel", o.kernel], ["hostname", o.host], ["architecture", o.arch], ["uptime", fmtUp(G.system.uptimeSec)], ["processes", o.procs], ["threads", o.threads.toLocaleString()]])}</div>
          <div class="tablewrap"><table class="procs"><thead><tr><th class="r">PID</th><th>USER</th><th>S</th><th class="r">CPU%</th><th class="r">MEM%</th><th>COMMAND</th></tr></thead>
            <tbody id="procs">${procRows()}</tbody></table></div>
        </div>
      </section>
    </div>`;
  }
  const netKv = () => kv([["download", fmtRate(P.net.rx)], ["upload", fmtRate(P.net.tx)], ["link use", ((P.net.rx + P.net.tx) * 8 / 1e6 / P.net.link * 100).toFixed(2) + "%"]]);
  const stColor = s => s === "R" ? "var(--c-gpu)" : s === "D" ? "var(--c-psu)" : "var(--dim)";
  const procRows = () => P.os.top.slice().sort((a, b) => b[3] - a[3]).map(([pid, u, st, cpu, mem, cmd]) =>
    `<tr><td class="r num">${pid}</td><td>${u}</td><td class="st" style="color:${stColor(st)}" title="${st === "R" ? "running" : "sleeping"}">${st}</td><td class="r num" style="color:${cpu > 10 ? "var(--c-os)" : "inherit"}">${cpu.toFixed(1)}</td><td class="r num">${mem.toFixed(1)}</td><td class="cmd" title="${esc(cmd)}">${esc(cmd)}</td></tr>`).join("");

  function fillCpuBits() {
    const th = $("#threads"); if (th) th.innerHTML = P.cpu.threads.map(v => `<div class="th num" style="--l:${v.toFixed(0)}">${v.toFixed(0)}</div>`).join("");
    const co = $("#cores"); if (co) co.innerHTML = P.cpu.cores.map((t, i) => `<div class="core"><div class="bar" style="height:${clamp((t - 30) / 60 * 100, 6, 100)}%;--h:${heat(t)}"></div><span class="num">${t.toFixed(0)}°</span></div>`).join("");
    const mx = $("#coreMax"); if (mx) mx.textContent = `max ${Math.max(...P.cpu.cores).toFixed(0)}°C`;
  }

  // ======================= dot-matrix graphs (btop-style) =======================
  // Each graph: a field of faint dots; data columns light up dots, brighter toward the top.
  const GRAPHS = {
    load:  { acc: "--brand-hot", up: () => H.cpu.map(v => v / 100 * 1.6), max: () => 1.6, fmt: v => v.toFixed(2) + " load" },
    cpu:   { acc: "--c-cpu", up: () => H.cpu, max: () => 100, fmt: v => v.toFixed(0) + "%", line: () => H.cpuT, lineMax: 100, lineFmt: v => v.toFixed(0) + "°C" },
    ram:   { acc: "--c-ram", up: () => H.ram, ghost: () => H.ramC, max: () => 100, fmt: v => v.toFixed(0) + "% in use" },
    ssd:   { acc: "--c-ssd", up: () => H.ssdR, down: () => H.ssdW, max: () => Math.max(8 * MB, ...H.ssdR, ...H.ssdW), fmt: fmtRate, upCol: "#ff8a9a" },
    gpu:   { acc: "--c-gpu", up: () => H.gpu, max: () => 100, fmt: v => v.toFixed(0) + "%", line: () => H.gpuT, lineMax: 100, lineFmt: v => v.toFixed(0) + "°C" },
    psu:   { acc: "--c-psu", up: () => H.psuHi, ghostUnder: () => H.psuLo, max: () => Math.max(...H.psuHi) * 1.25, fmt: v => "~" + v.toFixed(0) + " W" },
    net:   { acc: "--c-net", up: () => H.netRx, down: () => H.netTx, downCol: "#e0c6ff", max: () => Math.max(4 * MB, ...H.netRx, ...H.netTx), fmt: fmtRate },
  };
  const hover = {};
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || n;

  function drawGraph(el) {
    const key = el.dataset.graph, cfg = GRAPHS[key], cv = el.querySelector("canvas"); if (!cfg || !cv) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, Hh = cv.clientHeight;
    if (!W) return;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(Hh * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, Hh);
    const acc = cssVar(cfg.acc), pitch = 4, r = 1.1;
    const cols = Math.floor(W / pitch), rows = Math.floor(Hh / pitch);
    const mirror = !!cfg.down, mid = mirror ? Math.floor(rows / 2) : rows;
    const max = cfg.max();
    const sample = (arr, c) => { const i = Math.round(c / (cols - 1) * (arr.length - 1)); return arr[i]; };
    const upA = cfg.up(), downA = cfg.down ? cfg.down() : null, ghostA = cfg.ghost ? cfg.ghost() : null, underA = cfg.ghostUnder ? cfg.ghostUnder() : null;
    const hv = hover[key];
    for (let c = 0; c < cols; c++) {
      const x = c * pitch + pitch / 2;
      const upH = Math.round(clamp(sample(upA, c) / max, 0, 1) * mid);
      const ghH = ghostA ? Math.round(clamp(sample(ghostA, c) / max, 0, 1) * mid) : 0;
      const unH = underA ? Math.round(clamp(sample(underA, c) / max, 0, 1) * mid) : 0;
      const dnH = downA ? Math.round(clamp(sample(downA, c) / max, 0, 1) * (rows - mid)) : 0;
      const isHover = hv != null && Math.abs(hv - c) < 1;
      for (let rr = 0; rr < rows; rr++) {
        const y = rr * pitch + pitch / 2;
        let col = "rgba(255,255,255,0.045)";
        if (!mirror || rr < mid) {
          const lvl = mid - rr; // 1..mid from the baseline up
          if (lvl <= upH) {
            const t = lvl / mid;
            col = (cfg.upCol || acc); ctx.globalAlpha = (underA && lvl <= unH) ? 0.95 : 0.35 + t * 0.65;
            if (underA && lvl > unH) ctx.globalAlpha = 0.45;
          } else if (lvl <= ghH) { col = "#ffce9c"; ctx.globalAlpha = 0.28; }
          else ctx.globalAlpha = 1;
        } else {
          const lvl = rr - mid + 1;
          if (lvl <= dnH) { col = cfg.downCol || acc; ctx.globalAlpha = 0.35 + lvl / (rows - mid) * 0.65; } else ctx.globalAlpha = 1;
        }
        if (isHover && col.startsWith("rgba(255")) { col = "rgba(255,255,255,0.18)"; }
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (mirror) { ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(0, mid * pitch - 0.5, W, 1); }
    if (cfg.line) { // temperature overlay line
      const L = cfg.line(); ctx.lineWidth = 1.5; ctx.lineJoin = "round";
      const grad = ctx.createLinearGradient(0, Hh, 0, 0);
      grad.addColorStop(0, heat(40)); grad.addColorStop(0.55, heat(65)); grad.addColorStop(0.85, heat(85)); grad.addColorStop(1, heat(95));
      ctx.strokeStyle = grad; ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 3; ctx.beginPath();
      L.forEach((v, i) => { const x = i / (L.length - 1) * W, y = Hh - v / cfg.lineMax * Hh; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    // readout
    let rd = el.querySelector(".read");
    if (hv != null) {
      if (!rd) { rd = document.createElement("div"); rd.className = "read num"; el.append(rd); }
      const idx = Math.round(hv / (cols - 1) * (upA.length - 1)), ago = upA.length - 1 - idx;
      let t = `-${ago}s · ${cfg.fmt(upA[idx])}`;
      if (downA) t = `-${ago}s · ↑ ${cfg.fmt(upA[idx])} · ↓ ${cfg.fmt(downA[idx])}`;
      if (cfg.line) t += ` · ${cfg.lineFmt(cfg.line()[idx])}`;
      rd.textContent = t; rd.hidden = false;
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(hv * pitch + pitch / 2 - 0.5, 0, 1, Hh);
    } else if (rd) rd.hidden = true;
  }
  const drawAll = () => $$("[data-graph]").forEach(drawGraph);

  // ======================= render =======================
  function render() {
    $("#root").innerHTML = shell(state.page === "general" ? generalPage() : perfPage());
    if (state.page === "performance") fillCpuBits();
    placeIndicator(false);
    drawAll();
    intro();
  }

  function placeIndicator(animate) {
    const nav = $(".nav"), on = nav && nav.querySelector("a.on"), ind = nav && nav.querySelector(".ind");
    if (!on || !ind) return;
    const to = { x: on.offsetLeft, y: on.offsetTop, width: on.offsetWidth, height: on.offsetHeight };
    if (animate && canAnim) M.animate(ind, to, { type: "spring", stiffness: 420, damping: 34 });
    else { ind.style.width = to.width + "px"; ind.style.height = to.height + "px"; ind.style.transform = `translate(${to.x}px, ${to.y}px)`; }
  }

  function intro() {
    $$("[data-count]").forEach(el => {
      const target = parseFloat(el.dataset.count), dec = +(el.dataset.dec ?? 1), suf = el.dataset.suf || "";
      const set = n => el.textContent = n.toFixed(dec) + suf;
      canAnim ? M.animate(0, target, { duration: 1.1, ease: [0.16, 1, 0.3, 1], onUpdate: set }) : set(target);
    });
    if (!canAnim) return;
    M.animate($$("[data-anim]"), { opacity: [0.2, 1], y: [6, 0] }, { delay: M.stagger(0.06), duration: 0.35, ease: "linear" });
    $$(".seg i").forEach((el, i) => M.animate(el, { scaleX: [0, 1] }, { delay: 0.25 + i * 0.08, duration: 0.9, ease: [0.16, 1, 0.3, 1] }));
    $$(".core .bar").forEach((el, i) => M.animate(el, { scaleY: [0, 1] }, { delay: 0.3 + i * 0.04, duration: 0.6, ease: [0.16, 1, 0.3, 1] }));
    $$(".core .bar").forEach(el => el.style.transformOrigin = "bottom");
    M.animate($$(".th"), { opacity: [0, 1] }, { delay: M.stagger(0.02, { start: 0.3 }), duration: 0.2 });
    M.animate($$(".procs tbody tr"), { opacity: [0, 1], x: [-6, 0] }, { delay: M.stagger(0.03, { start: 0.4 }), duration: 0.25 });
    const t = $(".typed");
    if (t) { const full = t.textContent; let i = 0; t.textContent = "";
      const id = setInterval(() => { t.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(id); }, 28); }
  }

  // ======================= live ticking (1 s) =======================
  let spinI = 0;
  setInterval(() => { // spinners: speed follows load
    spinI++;
    $$("[data-spin]").forEach(el => {
      const k = el.dataset.spin, load = k === "cpu" ? P.cpu.util : k === "gpu" ? P.gpu.util : k === "ram" ? ramPct() : 30;
      const every = load > 70 ? 1 : load > 35 ? 2 : 3;
      if (spinI % every === 0) el.textContent = SPIN[(SPIN.indexOf(el.textContent) + 1) % SPIN.length];
    });
  }, 120);

  setInterval(() => {
    const c = P.cpu, g = P.gpu, push = (a, v) => { a.push(v); a.shift(); };
    c.util = jit(c.util, 10, 6, 96); c.temp = clamp(Math.round(jit(c.temp * 0.8 + (45 + c.util * 0.35) * 0.2, 2, 38, 92)), 38, 92);
    c.clock = Math.round(jit(c.clock, 160, 3200, 4850)); c.watts = Math.round(30 + c.util * 1.0 + Math.random() * 4);
    c.threads = c.threads.map(v => jit(v * 0.6 + c.util * 0.4, 30, 0, 100));
    c.cores = c.cores.map(t => jit(t * 0.85 + c.temp * 0.15, 3, 38, 95));
    const idle = 100 - c.util; c.u.idle = idle; c.u.user = c.util * 0.78; c.u.system = c.util * 0.17;
    P.ram.used = clamp(P.ram.used + (Math.random() - .5) * 0.15 * GB, 11 * GB, 15 * GB);
    g.util = Math.round(jit(g.util, 8, 2, 85)); g.temp = Math.round(jit(g.temp * 0.85 + (38 + g.util * 0.4) * 0.15, 1.5, 34, 86));
    g.watts = Math.round(18 + g.util * 1.4); g.clock = Math.round(g.util > 20 ? jit(1700, 200, 1200, 2100) : jit(1215, 60, 210, 1400));
    P.net.rx = clamp(P.net.rx * (0.7 + Math.random() * 0.6), 0.1 * MB, 18 * MB); P.net.tx = clamp(P.net.tx * (0.7 + Math.random() * 0.6), 0.02 * MB, 5 * MB);
    P.ssd.r = Math.max(0, jit(P.ssd.r, 3 * MB, 0, 30 * MB)); P.ssd.w = Math.max(0, jit(P.ssd.w, 2 * MB, 0, 20 * MB)); P.ssd.active = Math.round(clamp((P.ssd.r + P.ssd.w) / MB * 1.5, 0, 100));
    P.os.top.forEach(p => p[3] = Math.max(0, jit(p[3], p[3] * 0.3 + 0.3, 0, 60)));
    G.system.load[0] = jit(G.system.load[0], 0.18, 0.2, 1.6);
    push(H.cpu, c.util); push(H.cpuT, c.temp); push(H.ram, ramPct()); push(H.ramC, ramPct() + 25);
    push(H.ssdR, P.ssd.r); push(H.ssdW, P.ssd.w); push(H.gpu, g.util); push(H.gpuT, g.temp);
    const wl = wallRange(), wmid = (wl[0] + wl[1]) / 2 + (c.watts - 68) + (g.watts - 34);
    push(H.psuHi, wmid * 1.08); push(H.psuLo, wmid * 0.88);
    push(H.netRx, P.net.rx); push(H.netTx, P.net.tx);

    const set = (id, t, color) => { const e = document.getElementById(id); if (e) { e.textContent = t; if (color) e.style.color = color; } };
    if (state.page === "performance") {
      set("cpuUtil", c.util.toFixed(0)); set("cpuTemp", c.temp + "°", heat(c.temp)); set("cpuClock", (c.clock / 1000).toFixed(2) + " GHz");
      set("ramUsed", (P.ram.used / GB).toFixed(1)); set("ramPct", ramPct().toFixed(0) + "%");
      set("gpuUtil", g.util); set("gpuTemp", g.temp + "°", heat(g.temp)); set("gpuClock", g.clock + " MHz");
      set("netNow", fmtRate(P.net.rx + P.net.tx)); set("ssdNow", `· ${fmtRate(P.ssd.r)} r · ${fmtRate(P.ssd.w)} w`);
      set("mood-cpu", word(c.util)); set("mood-gpu", word(g.util)); set("mood-ram", word(ramPct()));
      set("mood-net", (P.net.rx + P.net.tx) > 6 * MB ? "busy" : "flowing"); set("mood-ssd", P.ssd.active > 20 ? "working" : "quiet");
      const w = $("#cpuWatt"); if (w) w.innerHTML = hm("wattage", c.watts / 142 * 100, c.watts + " W", 14);
      const gw = $("#gpuWatt"); if (gw) gw.innerHTML = hm("wattage", g.watts / g.limit * 100, g.watts + " W", 14);
      const sa = $("#ssdAct"); if (sa) sa.innerHTML = hm("activity", P.ssd.active, P.ssd.active + "%", 14);
      const cu = $("#cpuU"); if (cu) cu.innerHTML = kv(Object.entries({ user: c.u.user, system: c.u.system, idle: c.u.idle, "i/o wait": c.u.iowait, irq: c.u.irq, softirq: c.u.softirq, steal: c.u.steal }).map(([k, v]) => [k, v.toFixed(1) + "%"]));
      const nk = $("#netKv"); if (nk) nk.innerHTML = netKv();
      const pr = $("#procs"); if (pr) pr.innerHTML = procRows();
      $$(".th").forEach((el, i) => { el.style.setProperty("--l", c.threads[i].toFixed(0)); el.textContent = c.threads[i].toFixed(0); });
      $$(".core").forEach((el, i) => { const b = el.querySelector(".bar"); b.style.height = clamp((c.cores[i] - 30) / 60 * 100, 6, 100) + "%"; b.style.setProperty("--h", heat(c.cores[i])); el.querySelector("span").textContent = c.cores[i].toFixed(0) + "°"; });
      set("coreMax", `max ${Math.max(...c.cores).toFixed(0)}°C`);
    } else {
      set("load1", G.system.load[0].toFixed(2));
      G.system.load[1] = G.system.load[1] * 0.92 + G.system.load[0] * 0.08; G.system.load[2] = G.system.load[2] * 0.98 + G.system.load[0] * 0.02;
      set("loadAll", G.system.load.map(n => n.toFixed(2)).join("  "));
    }
    drawAll();
  }, 1000);

  // ======================= interaction =======================
  let toastT;
  function toast(text) {
    let t = $(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
    t.textContent = text; t.hidden = false;
    if (canAnim) M.animate(t, { opacity: [0, 1], y: [8, 0] }, { duration: 0.25 });
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
  }
  function go(page) {
    state.page = page;
    try { history.replaceState(null, "", "#" + page); } catch {}
    render(); scrollTo(0, 0);
  }

  document.addEventListener("click", e => {
    const a = e.target.closest("[data-nav]");
    if (a) {
      e.preventDefault();
      const p = a.dataset.nav;
      if (p === "general" || p === "performance") { if (p !== state.page) go(p); }
      else toast(`./${p} isn't in this draft yet.`);
      return;
    }
    if (e.target.closest("[data-todo]")) { e.preventDefault(); return toast("Opens the Minecraft page in the real site."); }
    if (e.target.closest("[data-logout]")) return toast("Log out is disabled in the draft.");
    const pin = e.target.closest("[data-pin]");
    if (pin) { const u = pin.closest(".svc").dataset.unit; state.pins.has(u) ? state.pins.delete(u) : state.pins.add(u); return refreshSvcs(); }
    const act = e.target.closest("[data-act]");
    if (act) {
      const u = act.closest(".svc").dataset.unit, row = G.services.find(s => s[0] === u), what = act.dataset.act;
      if (what === "stop") row[2] = false; if (what === "start") row[2] = true;
      state.msg = `${u}: ${what} done (draft).`; $("#svcMsg").textContent = state.msg; refreshSvcs();
      const li = document.querySelector(`.svc[data-unit="${CSS.escape(u)}"]`);
      if (li && canAnim) M.animate(li, { backgroundColor: ["rgba(255,59,85,.18)", "rgba(255,59,85,0)"] }, { duration: 0.9 });
      return;
    }
    if (e.target.closest("[data-reboot]")) {
      if (state.armed) { state.rebooted = true; state.armed = false; }
      else { state.armed = true; setTimeout(() => { if (state.armed) { state.armed = false; refreshReboot(); } }, 5000); }
      refreshReboot();
      const b = $("[data-reboot]"); if (b && canAnim && state.armed) M.animate(b, { x: [0, -4, 4, -3, 3, 0] }, { duration: 0.35 });
    }
  });
  document.addEventListener("input", e => { if (e.target.id === "svcFilter") { state.q = e.target.value; refreshSvcs(); } });
  document.addEventListener("pointermove", e => {
    const el = e.target.closest && e.target.closest("[data-graph]");
    $$("[data-graph]").forEach(g => { if (g !== el && hover[g.dataset.graph] != null) { hover[g.dataset.graph] = null; drawGraph(g); } });
    if (!el || e.target.tagName !== "CANVAS") return;
    const r = e.target.getBoundingClientRect(), cols = Math.floor(r.width / 4);
    hover[el.dataset.graph] = clamp(Math.round((e.clientX - r.left - 2) / 4), 0, cols - 1);
    drawGraph(el);
  });
  function refreshSvcs() { const b = $("#svcBody"); if (!b) return; b.innerHTML = servicesBody();
    if (canAnim) M.animate(b.querySelectorAll(".svc"), { opacity: [0.4, 1] }, { delay: M.stagger(0.015), duration: 0.2 }); }
  function refreshReboot() { const b = $("#rebootBody"); if (b) b.innerHTML = rebootBody(); }
  addEventListener("resize", () => { placeIndicator(false); drawAll(); });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if ((h === "general" || h === "performance") && h !== state.page) go(h); });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeIndicator(false); drawAll(); });
})();
</script>
